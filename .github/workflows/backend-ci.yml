name: MANVIA Backend CI

on:
  push:
    branches:
      - main
      - backend
      - developer
      - 'feature/**'
  pull_request:
    branches:
      - main
      - backend
      - developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, TypeCheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify Node.js version
        run: node backend/scripts/check-node-version.js

      - name: Install dependencies
        run: npm ci

      - name: Code formatting check
        run: npm run format:check

      - name: ESLint code analysis
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit, integration & E2E tests with coverage
        run: npm run test:cov

      - name: Build production bundle
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker container build
        run: docker build -t manvia-backend:ci ./backend
